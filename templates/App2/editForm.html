
{% extends "App2/base.html" %}

{% block content %}
<div class="card">
    <h2>Edit Employee</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Employee Name</label>
        <input type="text" name="name" value="{{ employee.name }}" required>

        <label>Email</label>
        <input type="email" name="email" value="{{ employee.email }}" required>

        <label>Age</label>
        <input type="number" name="age" value="{{ employee.age }}" min="1" required>

        <label>Salary</label>
        <input type="number" name="salary" value="{{ employee.salary }}" min="0" step="0.01" required>

        <label>Address</label>
        <textarea name="address" required>{{ employee.address }}</textarea>

        <label>Department</label>
        <select name="department" required>
            {% for d in department_data %}
                <option value="{{ d.id }}"
                    {% if employee.department_id == d.id %}selected{% endif %}>
                    {{ d.name }}
                </option>
            {% endfor %}
        </select>

        <label>Company</label>
        <select name="company" required>
            {% for c in company_data %}
                <option value="{{ c.id }}"
                    {% if employee.company_id == c.id %}selected{% endif %}>
                    {{ c.name }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Update Employee</button>
        <a class="btn" href="{% url 'empdata' %}">Cancel</a>
    </form>
</div>
{% endblock %}
