
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5fb;
            color: #243047;
        }
        nav {
            background: #243b70;
            padding: 16px 5%;
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover { color: #ffd166; }
        main {
            max-width: 1150px;
            margin: 30px auto;
            padding: 0 18px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px #0000000d;
            margin-bottom: 22px;
        }
        input, select, textarea {
            width: 100%;
            padding: 11px;
            margin: 7px 0 15px;
            border: 1px solid #cbd3e1;
            border-radius: 6px;
            font-size: 15px;
        }
        button, .btn {
            background: #3158a5;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
        }
        .danger { background: #c0392b; }
        .success { background: #16865c; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e9f1;
        }
        th { background: #eaf0ff; }
        .message {
            background: #e3f6e9;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .table-wrap { overflow-x: auto; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'empdata' %}">Employees</a>
        <a href="{% url 'addEmp' %}">Add Employee</a>
        <a href="{% url 'department' %}">Departments</a>
        <a href="{% url 'company' %}">Companies</a>
        <a href="/admin/">Admin</a>
    </nav>

    <main>
        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
